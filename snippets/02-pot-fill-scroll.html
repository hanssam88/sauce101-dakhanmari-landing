<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>스크롤로 채워지는 냄비 (형태 변화) — 복붙용</title>
<style>body{margin:0;background:#F3F0E5;color:#1D2A18;font:16px/1.7 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
.demo-pad{height:60vh;display:grid;place-items:center;text-align:center;color:#727C6A;font-size:14px;padding:0 20px}</style>
</head>
<body>
<div class="demo-pad">↓ 스크롤하면 병이 흔들리고 → 물이 차고 → 육수가 섞이고 → 재료가 들어갑니다.<br>(복사 영역은 「복사 시작 / 복사 끝」 주석 사이)</div>

<!-- ▼ 복사 시작 ─────────────────────────────────────────── -->
<!-- 스크롤 위치(0→1)가 CSS 변수 --lv(물 높이) --mix(육수 색) --tilt(병 기울기) --pour(따르는 줄기) --ing(재료) --steam(김)을 정한다.
     문구는 <li> 안에서 바꾸세요. 단계는 3개 고정. -->
<section class="s101-pot" id="s101Pot" aria-label="사용법">
  <div class="s101-pot__stick">
    <div class="s101-pot__panel">
      <svg class="s101-pot__svg" viewBox="0 0 480 400" role="img" aria-label="병을 흔들고, 물과 육수를 넣고, 재료를 넣어 끓이는 과정">
        <defs>
          <clipPath id="s101PotClip"><path d="M97 176H383V286C383 324 352 348 312 348H168C128 348 97 324 97 286Z"/></clipPath>
          <linearGradient id="s101GW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE8E0"/><stop offset="1" stop-color="#BDD2C8"/></linearGradient>
          <linearGradient id="s101GB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6C26E"/><stop offset="1" stop-color="#B98A31"/></linearGradient>
        </defs>
        <ellipse cx="240" cy="366" rx="150" ry="11" fill="rgba(40,30,8,.2)"/>
        <g clip-path="url(#s101PotClip)">
          <g class="s101-water"><path d="M-160 10c30-9 60 9 90 0s60-9 90 0 60 9 90 0 60-9 90 0 60 9 90 0 60-9 90 0 60 9 90 0 60-9 90 0V240H-160Z" fill="url(#s101GW)"/></g>
          <g class="s101-broth"><path d="M-160 10c30-9 60 9 90 0s60-9 90 0 60 9 90 0 60-9 90 0 60 9 90 0 60-9 90 0 60 9 90 0 60-9 90 0V240H-160Z" fill="url(#s101GB)"/></g>
        </g>
        <g class="s101-ing s101-ing1"><circle cx="202" cy="211" r="16"/><path d="M191 222l-17 17"/><circle cx="170" cy="243" r="4"/><circle cx="177" cy="250" r="4"/></g>
        <g class="s101-ing s101-ing2"><ellipse cx="268" cy="222" rx="24" ry="15" transform="rotate(-14 268 222)"/><path d="M256 220h.01M270 226h.01M279 216h.01"/></g>
        <g class="s101-ing s101-ing3"><path d="M226 196l44 22M232 208l38 14"/></g>
        <g class="s101-line">
          <path d="M97 176H383V286C383 324 352 348 312 348H168C128 348 97 324 97 286Z"/><path d="M84 176H396"/>
          <path d="M97 200H66a13 13 0 0 0 0 38H97"/><path d="M383 200h31a13 13 0 0 1 0 38h-31"/>
        </g>
        <g class="s101-steam"><path pathLength="1" d="M196 152c-12-18 12-24 0-42s12-24 0-42"/><path pathLength="1" d="M240 152c-12-18 12-24 0-42s12-24 0-42"/><path pathLength="1" d="M284 152c-12-18 12-24 0-42s12-24 0-42"/></g>
        <path class="s101-stream" pathLength="1" d="M340 121C326 142 302 170 294 224"/>
        <g class="s101-bottle"><g transform="translate(0 0)">
          <rect x="27" y="5" width="10" height="8" rx="1.5" fill="#1D2A18"/>
          <path d="M28 13v6c-5 3-8 6-8 12v21a5 5 0 0 0 5 5h14a5 5 0 0 0 5-5V31c0-6-3-9-8-12v-6z" fill="#6C4527" stroke="#1D2A18" stroke-width="2" stroke-linejoin="round"/>
          <rect x="20" y="34" width="24" height="18" fill="#F4F1E6" stroke="#1D2A18" stroke-width="1.5"/><rect x="20" y="45" width="24" height="7" fill="#658C3F"/>
        </g></g>
        <g class="s101-tagA"><rect x="368" y="14" width="74" height="30" rx="15" fill="#22321B"/><text x="405" y="34" text-anchor="middle">50g</text></g>
        <g class="s101-tagB"><rect x="368" y="248" width="86" height="30" rx="15" fill="#22321B"/><text x="411" y="268" text-anchor="middle">450g</text></g>
      </svg>
    </div>
  </div>
  <ol class="s101-pot__steps">
    <li class="s101-pot__step"><b>1</b><h3>사용 전 충분히 흔들어 주세요.</h3><p>원료 특성상 층 분리와 침전물이 생길 수 있으나 품질에는 이상이 없습니다.</p></li>
    <li class="s101-pot__step"><b>2</b><h3>물 450g에 육수 50g.</h3><p>2인분 기준입니다. 사용량은 기호에 따라 조절하세요.</p></li>
    <li class="s101-pot__step"><b>3</b><h3>재료를 넣고 끓이세요.</h3><p>닭·감자·부추·대파를 기호에 맞게 넣어 끓입니다.</p></li>
  </ol>
</section>
<style>
.s101-pot{display:grid;gap:0 40px;max-width:1080px;margin:0 auto;padding:0 20px;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#1D2A18;word-break:keep-all}
@media(min-width:820px){.s101-pot{grid-template-columns:1.05fr .95fr;align-items:start}}
.s101-pot__stick{position:sticky;top:16px;align-self:start;z-index:2}
.s101-pot__panel{position:relative;aspect-ratio:1.1;border-radius:30px;overflow:hidden;background:radial-gradient(90% 60% at 50% 18%,#FFFDF3,rgba(255,253,243,0) 70%),linear-gradient(180deg,#EDE7D3,#DBD2B7);box-shadow:inset 0 0 0 1px rgba(29,42,24,.1),0 40px 70px -46px rgba(29,42,24,.6)}
.s101-pot__svg{position:absolute;left:4%;top:5%;width:92%;height:88%;overflow:visible;--lv:0;--mix:0;--tilt:0;--shake:0;--pour:0;--pend:0;--ing:0;--steam:0}
.s101-water,.s101-broth{transform:translateY(calc(348px - var(--lv) * 172px))}
.s101-broth{opacity:var(--mix)}
.s101-water path,.s101-broth path{animation:s101wave 4.2s linear infinite}
@keyframes s101wave{to{transform:translateX(180px)}}
.s101-line path{fill:none;stroke:#1D2A18;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.s101-ing{fill:#F3F0E5;stroke:#1D2A18;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:clamp(0,calc((var(--ing) - var(--s,0)) * 4),1);transform:translateY(calc((1 - clamp(0,calc((var(--ing) - var(--s,0)) * 3),1)) * -80px))}
.s101-ing1{--s:0}.s101-ing2{--s:.22}.s101-ing3{--s:.44;fill:none;stroke:#658C3F;stroke-width:5}
.s101-steam{opacity:var(--steam);animation:s101drift 3.6s ease-in-out infinite}
.s101-steam path{fill:none;stroke:#3E5A25;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--steam))}
@keyframes s101drift{50%{transform:translateY(-7px)}}
.s101-stream{fill:none;stroke:#C99A3E;stroke-width:6;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:calc(1 - var(--pour) - var(--pend))}
.s101-bottle{transform:translate(372px,98px) rotate(calc(var(--tilt) * -128deg + var(--shake) * 8deg)) scale(1.5) translate(-32px,-32px);opacity:calc(1 - var(--ing) * .9)}
.s101-tagA{opacity:clamp(0,calc((1 - var(--tilt) * 2.4) * (1 - var(--ing) * 2)),1)}
.s101-tagB{opacity:clamp(0,calc((var(--lv) - .3) * 3),1)}
.s101-pot text{fill:#E3BC64;font:500 15px ui-monospace,Menlo,monospace}
.s101-pot__steps{list-style:none;margin:0;padding:0}
.s101-pot__step{min-height:80vh;display:flex;flex-direction:column;justify-content:center;opacity:.3;transition:opacity .5s}
.s101-pot__step.on{opacity:1}
.s101-pot__step b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1.5px solid #3E5A25;color:#3E5A25;font:500 15px ui-monospace,Menlo,monospace;margin-bottom:18px}
.s101-pot__step h3{margin:0 0 12px;font:800 clamp(24px,3vw,36px)/1.3 "Nanum Myeongjo","Noto Serif KR",serif;letter-spacing:-.04em}
.s101-pot__step p{margin:0;color:#4A5642}
@media(max-width:819px){.s101-pot__stick{top:8px}.s101-pot__panel{aspect-ratio:1.3}.s101-pot__step{min-height:64vh;justify-content:flex-start;padding-top:10vh}}
@media (prefers-reduced-motion:reduce){.s101-water path,.s101-broth path,.s101-steam{animation:none}.s101-pot__step{opacity:1}}
</style>
<script>
(function () {
  var root = document.getElementById('s101Pot'), svg = root.querySelector('.s101-pot__svg');
  var steps = [].slice.call(root.querySelectorAll('.s101-pot__step')), list = root.querySelector('.s101-pot__steps'), stick = root.querySelector('.s101-pot__stick');
  var narrow = matchMedia('(max-width:819px)'), RM = matchMedia('(prefers-reduced-motion:reduce)').matches;
  function clamp(v, a, b) { return Math.min(b === undefined ? 1 : b, Math.max(a === undefined ? 0 : a, v)); }
  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function seg(p, a, b) { return clamp((p - a) / (b - a)); }
  function state(p) {
    var s = seg(p, 0, .26);
    return { shake: s > 0 && s < 1 ? Math.sin(s * Math.PI * 8) * (1 - s) : 0, lv: .74 * ease(seg(p, .22, .44)),
      tilt: ease(seg(p, .44, .54)) - ease(seg(p, .72, .8)), pour: seg(p, .5, .6), pend: seg(p, .68, .76),
      mix: seg(p, .54, .72), ing: seg(p, .76, .92), steam: seg(p, .86, 1) };
  }
  function apply(o) { for (var k in o) svg.style.setProperty('--' + k, o[k].toFixed(4)); }
  function readLine() { return narrow.matches ? (stick.getBoundingClientRect().bottom + innerHeight) / 2 : innerHeight * .5; }
  var cur = 0, target = 0, raf = 0;
  function measure() {
    var r = list.getBoundingClientRect(), mid = readLine(), a = mid + innerHeight * .12, b = mid - innerHeight * .08;
    target = clamp((a - r.top) / (a - b + r.height));
    var best = 0, bd = 1e9;
    steps.forEach(function (s, i) { var q = s.getBoundingClientRect(), d = Math.abs(q.top + q.height / 2 - mid); if (d < bd) { bd = d; best = i; } });
    steps.forEach(function (s, i) { s.classList.toggle('on', i === best); });
  }
  function frame() {
    raf = 0; measure();
    cur += (target - cur) * .14; if (Math.abs(target - cur) < .0008) cur = target;
    apply(state(cur));
    if (cur !== target) raf = requestAnimationFrame(frame);
  }
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }
  if (RM) { apply(state(1)); steps.forEach(function (s) { s.classList.add('on'); }); return; }
  addEventListener('scroll', kick, { passive: true }); addEventListener('resize', kick); kick();
})();
</script>
<!-- ▲ 복사 끝 ─────────────────────────────────────────── -->

<div class="demo-pad" style="height:50vh">끝</div>
</body>
</html>
