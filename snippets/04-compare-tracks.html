<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>스크롤로 이어지는 비교 인포그래픽 — 복붙용</title>
<style>body{margin:0;background:#22321B;color:#F3F0E5;font:16px/1.7 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
.demo-pad{height:70vh;display:grid;place-items:center;text-align:center;color:rgba(243,240,229,.6);font-size:14px;padding:0 20px}</style>
</head>
<body>
<div class="demo-pad">↓ 스크롤하면 두 갈래의 선이 이어지며 단계가 켜집니다.<br>(복사 영역은 「복사 시작 / 복사 끝」 주석 사이)</div>

<!-- ▼ 복사 시작 ─────────────────────────────────────────── -->
<!-- 단계 수가 다른 두 갈래를 나란히 놓고, 스크롤 진행도(--p 0→1)에 따라 선이 이어지고 단계가 켜진다.
     짧은 갈래는 rate(기본 2.2배)로 먼저 끝난다. 각 <li>의 --s 는 켜지는 시점(0~1). -->
<div class="s101-cmp" id="s101Cmp">
  <article class="s101-track" data-rate="1">
    <header><span class="n">4</span><h3>직접 우려낼 때<small>일반적인 조리 순서</small></h3></header>
    <ol>
      <li style="--s:.06"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="41" cy="22" r="13"/><path d="M32 31L17 46"/><circle cx="13" cy="46" r="3.5"/><circle cx="18" cy="51" r="3.5"/></svg><span>재료 준비·손질</span></li>
      <li style="--s:.3"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 27h40v17c0 6-4.5 10-10.5 10h-19C16.5 54 12 50 12 44z"/><path d="M16 27c0-7 7-11 16-11s16 4 16 11"/><path d="M12 33H6M52 33h6"/></svg><span>오래 끓여 우려내기</span></li>
      <li style="--s:.55"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8c9 10 15 18 15 26a15 15 0 0 1-30 0c0-8 6-16 15-26z"/></svg><span>거품·기름 걷어내기</span></li>
      <li style="--s:.8"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M22 22h20l4 8v22a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4V30z"/><path d="M28 14h.01M32 10h.01M36 14h.01"/></svg><span>간 맞추기</span></li>
    </ol>
  </article>
  <article class="s101-track" data-rate="2.2">
    <header><span class="n">2</span><h3>이 병으로<small>라벨 사용법</small></h3></header>
    <ol>
      <li style="--s:.06"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M27 5h10v8H27z"/><path d="M28 13v6c-5 3-8 6-8 12v21a5 5 0 0 0 5 5h14a5 5 0 0 0 5-5V31c0-6-3-9-8-12v-6"/></svg><span>사용 전 충분히 흔들기</span></li>
      <li style="--s:.3"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M9 36h46v16a4 4 0 0 1-4 4H13a4 4 0 0 1-4-4z"/><path d="M22 46a10 10 0 0 1 20 0"/><path d="M32 46l5-6"/></svg><span>육수 50g + 물 450g 계량</span></li>
    </ol>
    <p class="done">✓ 국물 베이스 완성</p>
  </article>
</div>
<style>
.s101-cmp{display:grid;gap:22px;max-width:960px;margin:0 auto;padding:40px 20px;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#F3F0E5;word-break:keep-all}
@media(min-width:820px){.s101-cmp{grid-template-columns:1.15fr .85fr;gap:28px}}
.s101-track{--p:0;border:1px solid rgba(243,240,229,.16);border-radius:22px;padding:clamp(22px,3vw,34px);background:rgba(243,240,229,.045)}
.s101-track header{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.s101-track .n{font:500 clamp(56px,7vw,88px)/1 ui-monospace,Menlo,monospace;letter-spacing:-.06em;color:#E3BC64}
.s101-track h3{margin:0;font:700 22px/1.3 "Nanum Myeongjo","Noto Serif KR",serif}
.s101-track h3 small{display:block;margin-top:6px;font:400 13px system-ui,sans-serif;color:rgba(243,240,229,.62)}
.s101-track ol{list-style:none;margin:0;padding:0 0 0 34px;position:relative;display:grid;gap:20px}
.s101-track ol::before,.s101-track ol::after{content:"";position:absolute;left:11px;top:16px;bottom:16px;width:2px;border-radius:2px}
.s101-track ol::before{background:rgba(243,240,229,.16)}
.s101-track ol::after{background:#E3BC64;transform-origin:top;transform:scaleY(var(--p))}
.s101-track li{--on:clamp(0,calc((var(--p) - var(--s)) * 6),1);position:relative;display:flex;align-items:center;gap:14px;font-size:17px;font-weight:500;opacity:calc(.32 + var(--on) * .68)}
.s101-track li::before{content:"";position:absolute;left:-30px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;border:2px solid rgba(243,240,229,.45);background:rgb(227 188 100 / var(--on));z-index:1}
.s101-track li svg{width:34px;height:34px;flex:none;fill:none;stroke:#E3BC64;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.s101-track .done{margin:22px 0 0;font-weight:700;color:#E3BC64;opacity:var(--p)}
</style>
<script>
(function () {
  var box = document.getElementById('s101Cmp'), tracks = [].slice.call(box.querySelectorAll('.s101-track'));
  var RM = matchMedia('(prefers-reduced-motion:reduce)').matches, cur = RM ? 1 : 0, target = 0, raf = 0;
  function clamp(v) { return Math.min(1, Math.max(0, v)); }
  function set(p) { tracks.forEach(function (t) { t.style.setProperty('--p', clamp(p * +t.getAttribute('data-rate')).toFixed(4)); }); }
  function frame() {
    raf = 0;
    var r = box.getBoundingClientRect(), a = innerHeight * .88, b = innerHeight * .3;
    target = clamp((a - r.top) / (a - b + r.height));
    cur += (target - cur) * .14; if (Math.abs(target - cur) < .0008) cur = target;
    set(cur); if (cur !== target) raf = requestAnimationFrame(frame);
  }
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }
  if (RM) { set(1); return; }
  addEventListener('scroll', kick, { passive: true }); addEventListener('resize', kick); kick();
})();
</script>
<!-- ▲ 복사 끝 ─────────────────────────────────────────── -->

<div class="demo-pad" style="height:50vh">끝</div>
</body>
</html>
